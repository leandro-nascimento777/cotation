{# Linha com data de emissão, número do orçamento e (opcional) validade #}
<div class="linha-data">
  <span>{{ data_emissao }}</span>
  <span class="linha-data-direita">
    Orçamento nº <strong>{{ numero_orcamento }}</strong>
    {% if data_validade %}<br><span class="validade">Válido até {{ data_validade }}</span>{% endif %}
  </span>
</div>
